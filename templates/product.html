<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product['title'] }} | Chef Daniel Costa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<main class="product-page">

    <a href="/" class="back-link">← Voltar</a>

    <section class="produto">

        <div class="produto-imagem">
            <img
                src="{{ url_for('static', filename='capa-massas-risotos.PNG') }}"
                alt="Massas & Risotos"
            >
        </div>

        <div class="produto-info">

            <span class="eyebrow">CONTEÚDO DIGITAL</span>

            <h1>{{ product['title'] }}</h1>

            <p>{{ product['description'] }}</p>

            <div class="preco">
                <small>ACESSO AO E-BOOK</small>
                <strong>{{ product['price_cents'] | money }}</strong>
            </div>

            <a href="/cadastro" class="btn-primary">
                QUERO GARANTIR O MEU
            </a>

            <p>Compra segura • Acesso digital</p>

        </div>

    </section>

</main>

</body>
</html>
